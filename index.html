<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16603A">
<title>Parsley's Farm</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=6.0.1">
</head>
<body>
<div class="app">
  <div class="demo hide">Demo mode with sample data. Nothing is saved.</div>
  <header class="top">
    <div class="brand"><span class="logo">PF</span><div><div class="bname">Parsley's Farm</div><div class="bdate" id="bdate"></div></div></div>
    <button class="sync" id="sync" data-act="sync" aria-label="Sync status"><span class="dot"></span><span id="syncTxt">Loading</span></button>
  </header>
  <main id="main"><div class="empty-state"><b>Loading…</b></div></main>
</div>
<div class="selbar" id="selbar" hidden></div>
<nav class="nav" id="nav" aria-label="Main" hidden></nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>
<datalist id="prodlist"></datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=6.0.1"></script>
<script src="js/layout.js?v=6.0.1"></script>
<script src="js/seed-data.js?v=6.0.1"></script>
<script src="js/store.js?v=6.0.1"></script>
<script src="js/app.js?v=6.0.1"></script>
<script>
  document.getElementById('bdate').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('Offline support unavailable', e));
  }
</script>
</body>
</html>
